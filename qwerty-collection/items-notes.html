<!-- The magic Notes tab (§1.7): the owner's composer, then the profile's Notes; it holds no items of its own. -->
{{- $outbox := .ParentOutbox "view" -}}

<!-- The composer and the Notes share one centered card, up to 720px, as an Article's text does (.reading-column) -->
<div class="reading-column margin-top-xl card padding">

	{{- if $outbox.IsMyself -}}
		<div class="flex-row margin-bottom">
			<div class="flex-shrink-0 qwerty-note-avatar">
				{{- if eq "" $outbox.IconURL -}}
					<div class="circle width-48 flex-center">{{icon "person"}}</div>
				{{- else -}}
					<img src="{{$outbox.ActivityPubIconURL}}" alt="" class="circle width-48">
				{{- end -}}
			</div>
			<div class="flex-grow">
				{{- $outbox.View "add-note" -}}
			</div>
		</div>
	{{- end -}}

	{{- template "notes-list" (array .StreamID $outbox) -}}

</div>
