<!-- items-empty is the welcome on an empty collection, called as (array $collection icon heading text buttonLabel).
     Its button opens the collection's add action; visitors who cannot add see only the icon and a short note. -->
{{- $collection := index . 0 -}}
<div class="align-center margin-vertical-xl">
	<div class="text-light-gray" style="font-size:96px;">{{icon (index . 1)}}</div>
	{{- if $collection.UserCan "add" -}}
		<div class="text-2xl margin-none">{{index . 2}}</div>
		<div class="margin-vertical max-width-512 margin-horizontal-auto">{{index . 3}}</div>
		<button class="primary turboclick margin-top-lg" hx-get="/{{$collection.StreamID}}/add">{{index . 4}}</button>
	{{- else -}}
		<div class="margin-vertical max-width-512 margin-horizontal-auto text-gray">Nothing has been published here yet.  Check back later!</div>
	{{- end -}}
</div>
