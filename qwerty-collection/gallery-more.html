<!-- gallery-more is the sentinel after a full page of photo posts, called as (array $collectionID $page $tag).
     In view, it replaces itself with the next 30 posts older than this page's last (?createDate=LT:), in the same ?tag=. -->
{{- $collectionID := index . 0 -}}
{{- $page := index . 1 -}}
{{- $tag := index . 2 -}}
{{- if $page.IsLength 30 -}}
	<div class="qwerty-gallery-more"
		hx-get="/{{$collectionID}}/gallery-page?createDate=LT:{{$page.Last.CreateDate}}{{if ne `` $tag}}&tag={{$tag | urlquery}}{{end}}"
		hx-trigger="revealed"
		hx-target="this"
		hx-swap="outerHTML"
		hx-push-url="false">
	</div>
{{- end -}}
