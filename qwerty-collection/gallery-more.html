<!-- gallery-more is the sentinel after a full page of photo posts, called as (array $collectionID $page $isCustom).
     In view, it replaces itself with the next 30 posts after this page's last (?publishDate=LT:, or ?rank=LT: when Custom). -->
{{- $collectionID := index . 0 -}}
{{- $page := index . 1 -}}
{{- $isCustom := index . 2 -}}
{{- if $page.IsLength 30 -}}
	<div class="qwerty-gallery-more"
		hx-get="/{{$collectionID}}/gallery-page?{{if $isCustom}}rank=LT:{{$page.Last.Rank}}{{else}}publishDate=LT:{{$page.Last.PublishDate}}{{end}}"
		hx-trigger="revealed"
		hx-target="this"
		hx-swap="outerHTML"
		hx-push-url="false">
	</div>
{{- end -}}
