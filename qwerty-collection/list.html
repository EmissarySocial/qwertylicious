<!-- list is this collection's tab: the profile's tab bar with this tab selected and the owner's menu, then its contents.
     RULE: the tab bar reads the profile's Outbox query, as outbox.html does (see AGENTS.md). -->
<div id="profile-tabs">

<!-- The tab bar, with the owner's buttons for this collection after the tabs (qwerty-common/profile-menu.html) -->
<div class="profile-tabs-row">
	{{- template "profile-tabs" (array (.ParentOutbox "view") .StreamID .) -}}
</div>

{{- if ne "" .Summary -}}
	<div class="text-gray margin-bottom">{{.Summary}}</div>
{{- end -}}

{{- template "items" . -}}
</div>
