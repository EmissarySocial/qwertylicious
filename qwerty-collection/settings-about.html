<!-- settings-about is Edit About's form: the tab's name and the profile's About Me message, in one form (see AGENTS.md). -->
<!-- RULE: it copies the markup of an edit step's form, and each field name is its schema path, which set-data reads -->
{{- $outbox := .ParentOutbox "view" -}}
<form method="post" hx-post="/{{.StreamID}}/settings" hx-swap="none" hx-push-url="false" hx-trigger="submit" data-script="init send checkFormRules(changed:me as Values)">
	<div class="layout layout-vertical">
		<div class="layout-elements">
			<div class="layout-element layout-vertical-element">
				<label for="label_text" aria-hidden="true">Name</label>
				<input name="label" id="label_text" aria-label="Name" aria-description="Shown as this collection's tab on your profile. (PUBLIC)" tabIndex="0" type="text" maxlength="256" required="true" autocomplete="off" data-1p-ignore="true" value="{{.Label}}">
				<div aria-hidden="true" class="text-sm gray40">Shown as this collection's tab on your profile. (PUBLIC)</div>
			</div>
			<!-- RULE: showLimit hangs its counter on the field's last node, so the description closes the field with no space after it -->
			<div class="layout-element layout-vertical-element">
				<label for="statusMessage_textarea" aria-hidden="true">About Me</label>
				<textarea name="statusMessage" id="statusMessage_textarea" rows="12" aria-label="About Me" aria-description="Displayed on your profile page. Markdown is allowed. (PUBLIC)" tabIndex="0" maxlength="8192" script="install showLimit">{{$outbox.StatusMessage}}</textarea>
				<div aria-hidden="true" class="text-sm gray40">Displayed on your profile page. Markdown is allowed. (PUBLIC)</div></div>
			<!-- The profile's line-break choice, saved with the message; the markup an edit step draws for a toggle -->
			<!-- RULE: the value is a whole attribute, because the minifier lowercases an action written between attributes -->
			<div class="layout-element layout-vertical-element">
				<label for="data_hardWraps_toggle" aria-hidden="true"></label>
				<span id="data_hardWraps_toggle" data-script="install toggle " name="data.hardWraps" value="{{$outbox.Data `hardWraps`}}" true-text="Keeping line breaks as typed." false-text="Keep line breaks as typed?"></span>
			</div>
		</div>
	</div>
	<div class="flex-row flex-align-center">
		<div class="flex-grow">
			<button type="submit" id="inline-save-button" class="primary" tabIndex="0" data-script="install SaveButton">Save Changes</button>
			<button type="button" data-script="on click trigger closeModal" tabIndex="0">Cancel</button>
			<span id="htmx-response-message" data-script="on submit from closest &lt;form/&gt; set my innerHTML to &#39;&#39;"></span>
		</div>
		<div>
			<span class="text-red" role="button" hx-get="/{{.StreamID}}/delete" hx-push-url="false">Delete</span>
		</div>
	</div>
</form>
