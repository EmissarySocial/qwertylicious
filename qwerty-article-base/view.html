<div class="page padding framed h-entry" script="init send SelectNav(id:'{{.NavigationID}}')">

	<div id="menu-bar" class="flex-row stretch flex-justify-between flex-align-center margin-bottom-sm">
		<div class="left pos-relative">
			<a class="button tertiary" href="javascript:history.back()"><span class="icon margin-right-xs">{{icon "chevron-left"}}</span><span class="text-sm">Back</span></a>
		</div>
		<div class="center">
			<span class="padding-none margin-none">{{.Name}}</span>
		</div>
		{{- if .UserCan "edit" -}}
			<div class="right pos-relative">
				<a class="button tertiary icon" href="/{{.StreamID}}/edit"><span class="icon">{{icon "pencil"}}</span></a>
			</div>
		{{- end -}}
	</div>

	<article class="content margin-bottom">
		{{- .Widgets "LEFT" -}}
		<div class="content-main">
			{{- .Widgets "TOP" -}}
			<div class="e-content">{{- .ContentHTML -}}</div>
			{{- .Widgets "BOTTOM" -}}
		</div>
		{{- .Widgets "RIGHT" -}}
	</article>

	<div 
		hx-get="/{{.StreamID}}" 
		hx-trigger="refreshPage from:window"
		hx-target="main"
		hx-swap="innerHTML"
		hx-push-url="false">
	</div>
	
</div>
