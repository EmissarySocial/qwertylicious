<!-- entry-byline: the author's avatar, name, publish date, and a Follow button for visitors. Shared by view.html and modal.html. -->
<div class="flex-row flex-align-center margin-bottom-lg">
	<div class="width-48 flex-center">
		<img src="{{.AttributedTo.IconURL}}" alt="" class="width-48 circle">
	</div>
	<div class="p-author h-card flex-grow">
		<div class="p-name">
			<a class="turboclick" href="{{.AttributedTo.ProfileURL}}" hx-boost="true">{{.AttributedTo.Name}}</a>
		</div>
		<div class="text-sm">{{.PublishDate | longDate}}</div>
	</div>
	{{- if not .IsAuthor -}}
		<!-- Follow opens the author's Follow modal, or follows in one click once CamperJS finds a saved account that can -->
		<div data-camper-intent="follow" data-camper-object="{{.AttributedTo.ProfileURL}}">
			<button hx-get="/@{{.AttributedTo.UserID.Hex}}/follow" class="primary text-sm turboclick camper-hide-if-ready">{{icon "plus"}} Follow</button>
			<button type="button" class="primary text-sm camper-show-if-ready" data-camper-action="intent" hidden>{{icon "plus"}} Follow</button>
		</div>
		<script src="/.themes/global/resources/camperjs-0.2.0/camper.js"></script>
	{{- end -}}
</div>
