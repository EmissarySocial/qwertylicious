<!-- modal: an entry opened from its map's marker or its calendar, drawn over its collection or its own page.
     Its Replies tab re-opens this modal with ?tab=replies. -->
<div class="{{if .StartDate.IsZero}}h-entry{{else}}h-event{{end}}">

	<!-- The author's pencil, top right, opens the edit modal in its place (its pair is edit-pencil.html) -->
	{{- if .UserCan "edit" -}}
		<button type="button" class="edit-circle corner-pencil turboclick" hx-get="/{{.StreamID}}/edit" hx-push-url="false" aria-label="Edit">{{icon "pencil"}}</button>
	{{- end -}}

	{{- if ne "" .IconURL -}}
		<img src="{{.IconURL}}.webp" alt="{{.Data `iconDescription`}}" class="block width-100%" style="max-height:320px; object-fit:cover; border-radius:var(--border-radius);">
	{{- end -}}

	<div class="padding">
		<h1 class="p-name margin-top-none margin-bottom">{{.Label}}</h1>

		{{- template "replies-tabs" (array . "Details" "modal") -}}

		{{- if eq (.QueryParam "tab") "replies" -}}
			{{- template "replies-panel" . -}}
		{{- else -}}
			{{- template "entry-body" . -}}
		{{- end -}}

		<!-- Close button -->
		<div class="flex-row flex-align-center margin-top">
			<button script="on click trigger closeModal">Close Window</button>
		</div>
	</div>
</div>
