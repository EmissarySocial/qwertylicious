<!-- The Collections tab's form: add a collection, drag the collections into tab order, or edit each one. -->
<!-- RULE: a drop that changes the order saves it at once, on Sortable's update event; a drop in place sends nothing -->
{{- $collections := (.Outbox.Where "templateId" "qwerty-collection").ByRank.Slice -}}
<form hx-post="/@me/settings-collections-form" hx-trigger="update" hx-target="this" hx-swap="outerHTML" hx-push-url="false">

	<!-- The limit is also enforced by the outbox's add-collection action (template.hjson) -->
	<div class="margin-bottom-lg">
		{{- if lt (len $collections) 8 -}}
			<button type="button" class="primary turboclick" hx-get="/@{{.UserID}}/add-collection">+ Add a Collection</button>
		{{- else -}}
			<div class="text-sm text-gray">You have 8 collections, the most a profile can hold.</div>
		{{- end -}}
	</div>

	<table class="table margin-bottom">
		<tbody script="install sortContainer">
			{{- range $collections -}}
				<tr class="draggable">
					<td class="drag-handle" style="width:1px;">
						<input type="hidden" name="keys" value="{{.ObjectID.Hex}}">
						{{icon "drag-handle"}}
					</td>
					<td>{{.Label}}</td>
					<!-- Edit opens the collection's Edit Collection modal (qwerty-collection's settings action) -->
					<td class="align-right" style="width:1px;">
						<button type="button" class="text-sm turboclick" hx-get="/{{.ObjectID.Hex}}/settings">Edit</button>
					</td>
				</tr>
			{{- end -}}
		</tbody>
	</table>

</form>

<!-- onload drives sortContainer: htmx loads this script asynchronously, after the behavior installs -->
<script
	src="/.themes/global/resources/sortable-1.15.7/Sortable.min.js"
	onload="window.dispatchEvent(new Event('sortableReady'))"></script>
