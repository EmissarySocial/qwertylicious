{{- $isMyself := .IsMyself -}}

<div class="framed page padding-none">

	{{- template "header" . -}}

	<div class="padding max-width-800">

		<!-- "Tabs" -->
		<div role="tablist" class="underlined">
			<a href="/@{{.UserID}}" hx-get="/@{{.UserID}}" hx-push-url="false" hx-swap="innerHTML transition:false show:none" role="tab">Posts</a>
			<span role="tab" aria-selected="true">Replies</span>
			<a href="/@{{.UserID}}/about" hx-get="/@{{.UserID}}/about" hx-push-url="false" hx-swap="innerHTML transition:false show:none" role="tab">About</a>
		</div>

		<!-- Replies -->
		<div class="margin-bottom-xl">
			{{- template "replies-list" . -}}
		</div>

	</div>

	<div 
		hx-get="/@{{.UserID}}/about" 
		hx-trigger="refreshPage from:window" 
		hx-target="main" 
		hx-swap="innerHTML"
		hx-push-url="false">
	</div>

</div>
