<!-- outbox-empty is About's prompt on a profile with no collections: the owner's welcome (as items-empty's), or a visitor's note -->
{{- if .IsMyself -}}

	<div class="align-center margin-vertical-xl">
		<div class="text-light-gray" style="font-size:96px;">{{icon "collection"}}</div>
		<div class="text-2xl margin-none">Your Collections</div>
		<div class="margin-vertical max-width-512 margin-horizontal-auto">Collections are the tabs on your profile, each holding one kind of post: articles, photos, notes, events, and more.  Make your first one now.</div>
		<button class="primary turboclick margin-top-lg" hx-get="/@{{.UserID}}/add-collection">+ Add a Collection</button>
	</div>

{{- else -}}

	<div class="card padding-horizontal padding-vertical-xl">
		<b>{{.DisplayName}}</b> hasn't published anything yet.  Check back later!
	</div>

{{- end -}}
