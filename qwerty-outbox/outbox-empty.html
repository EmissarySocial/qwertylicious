{{- if .IsMyself -}}

	<div class="bg-stripes padding-horizontal padding-vertical-xl">

		<div class="text-lg bold margin-top-none margin-bottom">Let's Make Your First Collection!</div>

		<div>
			Collections are the tabs on your profile, and hold your Articles.
			<span class="link turboclick" hx-get="/@{{.UserID}}/add-collection">+ Add a Collection</span>
		</div>
	</div>

{{- else -}}

	<div class="card padding-horizontal padding-vertical-xl">
		<b>{{.DisplayName}}</b> hasn't published anything yet.  Check back later!
	</div>

{{- end -}}
