{{- template "settings-tabs" . -}}

<div class="card border padding transition-main-card">

	<div class="alert-gray">
		Drag your collections into the order their tabs show on your profile.
		The order saves as soon as you drop one.  A profile holds up to 8.
	</div>

	{{- .View "settings-collections-form" -}}
</div>

<!-- RULE: Edit Collection ends with refresh-page, so reload this tab rather than the settings page (see AGENTS.md) -->
<div hx-get="/@me/settings-collections" hx-trigger="refreshPage from:window" hx-target="#profile-settings" hx-push-url="false"></div>
