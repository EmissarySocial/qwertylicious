<!-- head: the photo's <head> tags, which as-modal puts in the full page so a shared link previews the photo.
     The HTML caption becomes plain text inside an attribute. -->
{{- $hasCaption := ne "" (print .ContentHTML) -}}
<!-- The photo's title, or else who took it -->
{{- $title := print "Photo by " .AttributedTo.Name -}}
{{- if ne "" .Label -}}{{- $title = .Label -}}{{- end -}}
<title>{{.DomainLabel}} - {{$title}}</title>
<link rel="canonical" href="{{.Permalink}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{.DomainLabel}}">
<meta property="og:title" content="{{$title}}">
<meta property="og:url" content="{{.Permalink}}">
{{- if ne "" .IconURL }}
<meta property="og:image" content="{{.IconURL}}.webp?width=1200">
{{- if $hasCaption }}
<meta property="og:image:alt" content="{{.ContentHTML}}">
{{- end }}
<meta name="twitter:card" content="summary_large_image">
{{- end }}
{{- if $hasCaption }}
<meta name="description" content="{{.ContentHTML}}">
<meta property="og:description" content="{{.ContentHTML}}">
{{- end }}
