<!-- modal: a photo post opened from its gallery or its own URL; its Replies tab re-opens it with ?tab=replies. -->
<div class="padding">
	{{- template "replies-tabs" (array . "Photo" "modal") -}}

	{{- if eq (.QueryParam "tab") "replies" -}}
		{{- template "replies-panel" . -}}
		<div class="flex-row margin-top">
			<button script="on click trigger closeModal">Close</button>
		</div>
	{{- else -}}
		{{- template "photo-figure" (array . "modal") -}}

		<!-- Share and Close buttons -->
		<div class="flex-row flex-align-center margin-top">
			<!-- Share opens the device's share sheet, or copies the URL -->
			<button type="button" class="turboclick" data-share-url="{{.Permalink}}" script="
				on click
					if navigator.share
						call navigator.share({url: my @data-share-url})
					else
						call navigator.clipboard.writeText(my @data-share-url)
						put 'Link Copied' into the first <span/> in me
					end
				catch error
					log error
				end">{{icon "share"}} <span>Share</span></button>
			<button script="on click trigger closeModal">Close</button>
		</div>
	{{- end -}}
</div>
