<!-- responses: under the photo, its Reply, Like, Boost, "⁂", and Share buttons, its Replies, Likes, and Boosts tabs, and the open tab's list -->
<div class="qwerty-responses margin-top" hx-target="this" hx-swap="outerHTML" hx-push-url="false">
	<div class="qwerty-responses-row flex-row flex-align-center flex-wrap margin-bottom-lg">

		<!-- RULE: text-sm marks the buttons that share the tabs' font size (qwerty-theme's 03-app.css), and margin-none keeps it from shifting the row -->
		<!-- RULE: mobile-hide drops each label in a window under 640px, so every button carries its name in aria-label -->
		<div class="text-sm margin-none flex-row flex-align-center">
			<!-- Signed in, Reply opens the visitor's own inbox at this photo with its reply form; otherwise an Activity Intent -->
			{{- if .AcceptsReplies -}}
				{{- if .IsAuthenticated -}}
					<button type="button" class="turboclick" hx-target="main" hx-swap="outerHTML" hx-get="/@me/newsfeed/browse-reply?url={{.Permalink | urlquery}}" aria-label="Reply">{{icon "reply"}}<span class="mobile-hide"> Reply</span></button>
				{{- else -}}
					<span data-camper-intent="reply" data-camper-inreplyto="{{.Permalink}}" data-camper-object="{{.Permalink}}">
						<button type="button" class="turboclick camper-hide-if-ready" hx-get="/{{.StreamID}}/intent?intent=create&inReplyTo={{.Permalink | urlquery}}" hx-push-url="false" aria-label="Reply">{{icon "reply"}}<span class="mobile-hide"> Reply</span></button>
						<button type="button" class="camper-show-if-ready" data-camper-action="intent" aria-label="Reply" hidden>{{icon "reply"}}<span class="mobile-hide"> Reply</span></button>
					</span>
				{{- end -}}
			{{- end -}}
			<!-- Like and Boost open base-intent's modal, or act in one click once CamperJS finds a saved account that can; "⁂" manages it -->
			{{- if .UserCan "like-button" -}}
				{{.View "like-button"}}
			{{- else -}}
				<span data-camper-intent="like" data-camper-object="{{.Permalink}}">
					<button type="button" class="turboclick camper-hide-if-ready" hx-get="/{{.StreamID}}/intent?intent=like&object={{.Permalink}}" hx-push-url="false" aria-label="Like">{{icon "heart"}}<span class="mobile-hide"> Like</span></button>
					<button type="button" class="camper-show-if-ready" data-camper-action="intent" aria-label="Like" hidden>{{icon "heart"}}<span class="mobile-hide"> Like</span></button>
				</span>
				<span data-camper-intent="announce" data-camper-object="{{.Permalink}}">
					<button type="button" class="turboclick camper-hide-if-ready" hx-get="/{{.StreamID}}/intent?intent=announce&object={{.Permalink}}" hx-push-url="false" aria-label="Boost">{{icon "announce"}}<span class="mobile-hide"> Boost</span></button>
					<button type="button" class="camper-show-if-ready" data-camper-action="intent" aria-label="Boost" hidden>{{icon "announce"}}<span class="mobile-hide"> Boost</span></button>
				</span>
				<button type="button" class="turboclick camper-show-if-has-accounts" hx-get="/{{.StreamID}}/intent" hx-push-url="false" aria-label="Manage Accounts" hidden>⁂</button>
				<script src="/.themes/global/resources/camperjs-0.2.0/camper.js"></script>
			{{- end -}}
			<!-- Share is last for every visitor, and the Share behavior shows it only where the browser has an OS share menu -->
			<button type="button" aria-label="Share" script="install Share" data-share-url="{{.Permalink}}" hidden>{{icon "share"}}<span class="mobile-hide"> Share</span></button>
		</div>

		<div class="flex-grow"></div>
		{{- template "responses-tabs" . -}}
	</div>

	{{- template "responses-list" . -}}
</div>
