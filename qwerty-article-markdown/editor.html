<!-- // TODO: Inline these scripts into the template. -->
<!-- Uses https://github.com/Ionaru/easy-markdown-editor -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
<script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>

<article class="content">
	<form id="markdownForm" hx-post="/{{.StreamID}}/editor" hx-trigger="save" hx-swap="none" hx-push-url="false">
		<textarea id="markdownContent" name="content">{{.ContentRaw}}</textarea>
	</form>
</article>

<style>
	.EasyMDEContainer {

		.CodeMirror {
			color: var(--black);
			background-color: unset;
			caret-color: var(--black);
			border: unset;

			.CodeMirror-cursor {
				border-left: 1px solid var(--black)!important;
			}
		}

		.editor-toolbar {
			margin-bottom: calc(var(--rhythm) * 2);
			border-radius: calc(var(--border-radius) * 0.625);
			border-top: unset;
			border-left: unset;
			border-right: unset;
			background-color: var(--page-background);

			button {
				border-radius: calc(var(--border-radius) / 2);

				&.active {
					border: var(--button-border);
					background-color: var(--button-background-hover);
				}
				&:hover {
					border: unset;
				}
			}

			.separator {
				border-left: 1px solid var(--input-border);
				border-right: 1px solid var(--input-border);
			}
		}

		.editor-statusbar {
			margin: unset;
			display: flex;
			justify-content: space-between;

			.upload-image {
				margin-left: unset;
			}
		}
	}

	@media screen and (max-width: 768px) {
		.EasyMDEContainer .editor-statusbar {
			justify-content: flex-end;

			.upload-image {
				display: none;
			}

			span {
				min-width: unset;
			}
		}
	}
</style>


<script type="text/javascript">
	var easyMDE = new EasyMDE({
		toolbar: ["bold", "italic", "heading", "|", "quote", "unordered-list", "ordered-list", "|", "link", "image", "|", "guide"],
		element:document.getElementById('markdownContent'),
		uploadImage:true,
		imageUploadEndpoint:"/{{.StreamID}}/upload-image",
		imagePathAbsolute:true,
	});

	easyMDE.codemirror.on("blur", function() {
		saveDraft(false);
	});
</script>

<script type="text/hyperscript">

	def saveDraft(promote)
		set #markdownContent.value to easyMDE.value()
		send save to #markdownForm
		wait for htmx:afterOnLoad from #markdownForm
		if promote then
			fetch /{{.StreamID}}/promote-draft with method:"POST"
			set window.location to "/{{.StreamID}}"
		end
	end
</script>
