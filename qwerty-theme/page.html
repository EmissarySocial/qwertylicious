<!DOCTYPE html>
<html data-theme="stone" lang="en">
<head>
	<title>{{.DomainLabel}} - {{.PageTitle}}</title>
	<link rel="webmention" href="/.webmention"/>
	{{ template "includes-head" .}}
</head>

<body hx-target="main" hx-swap="innerHTML transition:true show:window:top" hx-push-url="true" hx-ext="a11y" class="desktop"
	script="
 		install ToggleContainer
		install SelectNav">

	<!-- navigation-desktop emits the skip link, the sidebar <nav>, and beside it the mobile menu, which
	     replaces the sidebar on screens narrower than 640px (theme-default/stylesheet/04-nav-menu.css) -->
	{{- template "navigation-desktop" . -}}

	<main id="main">
		{{- .GetContent -}}
	</main>
	
	<aside></aside>

</body>

{{ template "includes-foot" .}}

</html>
