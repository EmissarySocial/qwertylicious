<!-- The Visual Editor (EditorJS), for an Article whose format is EDITORJS. It defines _save(), which edit-content.html calls -->
<article id="content-editor" data-content="{{.ContentRaw}}"></article>

<script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest" script="on load startArticleEditor()"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/paragraph@latest" script="on load startArticleEditor()"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest" script="on load startArticleEditor()"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/list@latest" script="on load startArticleEditor()"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/link@latest" script="on load startArticleEditor()"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/embed@latest" script="on load startArticleEditor()"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/image@latest" script="on load startArticleEditor()"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/attaches@latest" script="on load startArticleEditor()"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/code@latest" script="on load startArticleEditor()"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@latest" script="on load startArticleEditor()"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/table@latest" script="on load startArticleEditor()"></script>
<script src="https://cdn.jsdelivr.net/npm/editorjs-color-picker@latest/dist/index.umd.js" script="on load startArticleEditor()"></script>
<!-- Under hx-boost the bundles above load after this script, so each retries on load; a full page load starts it below -->
<script>
	window.startArticleEditor = function() {

		// Wait for the holder and every bundle, and start only once per page
		var holder = document.getElementById("content-editor")
		if (!holder || holder.dataset.started) return
		var bundles = ["EditorJS", "Paragraph", "Header", "LinkTool", "ImageTool", "Embed", "AttachesTool", "EditorjsList", "Quote", "CodeTool", "ColorPicker"]
		if (!bundles.every(function(name) { return window[name] !== undefined })) return
		holder.dataset.started = "true"

		// An Article just switched to this format has no content yet, and EditorJS starts empty without data
		var raw = holder.getAttribute("data-content")

		window.editor = new EditorJS({
			holder: "content-editor",
			data: raw ? JSON.parse(raw) : undefined,
			tools: {
				paragraph: {
					class: Paragraph,
					inlineToolbar: true,
				},
				header: {
					class: Header,
					inlineToolbar: ['link'],
					config: {
						placeholder: 'Header',
						levels: [1, 2, 3],
						defaultLevel: 2,
					},
				},
				linkTool: {
					class: LinkTool,
					config: {}
				},
				image: {
					class: ImageTool,
					config: {
						endpoints: {
							byFile: '/{{.StreamID}}/upload-image',
							byUrl: '/{{.StreamID}}/upload-image',
						}
					}
				},
				embed: {
					class: Embed,
					config: {
					}
				},
				attaches: {
					class: AttachesTool,
					config: {
						endpoint: 'http://localhost:8008/uploadFile'
					}
				},
				list: {
					class: EditorjsList,
					inlineToolbar: true,
					config: {
						defaultStyle: 'unordered',
					},
				},
				quote: {
					class: Quote,
					inlineToolbar: true,
				},
				code: {
					class: CodeTool,
				},
				ColorPicker: {
	      			class: window.ColorPicker.default,
	    		}
			},
		})
	}

	// EditorJS posts its JSON document as the request body
	window._save = async function() {
		var content = await window.editor.save()

		var response = await fetch("/{{.StreamID}}/edit-content", {
			method: "POST",
			body: JSON.stringify(content),
			headers: {"Content-Type": "application/json"}
		})

		// A failed save stops save() and publish() here, so the page keeps the unsaved text
		if (!response.ok) throw new Error("Saving the article failed: " + response.status)
	}

	startArticleEditor()
</script>
