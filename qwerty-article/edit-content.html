<!-- RULE: the editor follows the stored format, as the edit-content action's switch does; both name the same three (see AGENTS.md) -->
{{- if eq .ContentFormat "MARKDOWN" -}}
	{{- template "edit-content-markdown" . -}}
{{- else if eq .ContentFormat "HTML" -}}
	{{- template "edit-content-html" . -}}
{{- else -}}
	{{- template "edit-content-editorjs" . -}}
{{- end -}}

<!-- Save and Publish call the editor's own _save(), which posts its content in that format's shape -->
<script type="text/hyperscript">

	def save()
		_save()
		go to url "/{{.StreamID}}"
	end

	def publish()
		_save()
		htmx.ajax("GET", "/{{.StreamID}}/publish")
	end

</script>
