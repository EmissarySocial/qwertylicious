<div class="page framed h-entry">

	<!-- One bordered card holds the banner, the heading, and the article, as the edit page's card (edit.html) and the
	     profile card (qwerty-outbox/profile-header.html) hold theirs.  The card clips the banner to its corners. -->
	<div class="pos-relative card border padding-none">

		{{- template "head-banner" . -}}

		<article id="article" class="content">

			{{- template "head-summary" . -}}
			{{- template "head-social" . -}}

			<!-- The rule between the heading and the article -->
			<hr class="margin-vertical-lg">

			{{- if .UserCan "view-premium" -}}
				<div id="article-content" class="e-content">{{- .ContentHTML -}}</div>

			{{- else -}}
				{{- template "view-subscribe" . -}}
			{{- end -}}

		</article>

	</div>

	<div 
		hx-get="/{{.StreamID}}" 
		hx-trigger="refreshPage from:window"
		hx-target="main"
		hx-swap="innerHTML"
		hx-push-url="false">
	</div>
	
	<link rel="stylesheet" href="/.templates/user-article/stylesheet" />

</div>
