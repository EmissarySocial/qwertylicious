<div class="page padding-none h-entry">

	{{- template "head-banner" . -}}

	<div class="pos-relative">

		<article id="article" class="margin-bottom">

			{{- template "head-summary" . -}}
			{{- template "head-social" . -}}

			{{- if .UserCan "view-premium" -}}
				<div id="article-content" class="e-content">{{- .ContentHTML -}}</div>

			{{- else -}}
				{{- template "view-subscribe" . -}}
			{{- end -}}

		</article>

		{{- if .UserCan "edit" -}}
			<div class="pos-absolute-top-right">
				<a class="text-xs button" href="/{{.StreamID}}/edit">Edit &rarr;</a>
			</div>
		{{- end -}}

	</div>

	<div 
		hx-get="/{{.StreamID}}" 
		hx-trigger="refreshPage from:window"
		hx-target="main"
		hx-swap="innerHTML"
		hx-push-url="false">
	</div>
	
	<link rel="stylesheet" href="/.templates/qwerty-article/stylesheet" />

</div>
