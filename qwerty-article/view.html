<div class="page framed h-entry">

	{{- template "head-banner" . -}}

	<div class="pos-relative card">

		<article id="article" class="content">

			{{- template "head-summary" . -}}
			{{- template "head-social" . -}}

			{{- if .UserCan "view-premium" -}}
				<div id="article-content" class="e-content">{{- .ContentHTML -}}</div>

			{{- else -}}
				{{- template "view-subscribe" . -}}
			{{- end -}}

		</article>

		{{- if .UserCan "edit" -}}
			<div class="pos-absolute-top-right">
				<a class="button icon" href="/{{.StreamID}}/edit">{{icon "pencil"}}</a>
			</div>
		{{- end -}}

	</div>

	<div 
		hx-get="/{{.StreamID}}" 
		hx-trigger="refreshPage from:window"
		hx-target="main"
		hx-swap="innerHTML"
		hx-push-url="false">
	</div>
	
	<link rel="stylesheet" href="/.templates/user-article/stylesheet" />

</div>
