<!-- The Markdown editor (EasyMDE, vendored in Emissary's theme-global), for an Article whose format is MARKDOWN. It defines _save() -->
<link rel="stylesheet" href="/.themes/global/resources/easymde-2.21.0/easymde.min.css">
<style>
	.EasyMDEContainer {

		.CodeMirror {
			color: var(--gray100);
			background-color: var(--gray10);
			caret-color: var(--gray100);

			.CodeMirror-cursor {
				border-left: 1px solid var(--gray100)!important;
			}
		}

		.editor-toolbar {
			button {
				&.active {
					color:var(--gray00);
					background-color:var(--gray50);
					border-color:var(--gray60);
				}
				&:hover {
					background-color: var(--gray20);
				}
			}
		}
	}
</style>

<textarea id="markdown-content" aria-label="Article text, in Markdown">{{.ContentRaw}}</textarea>

<script>

	// Start once per page.  htmx loads the library asynchronously after a swap, so this also runs from its onload
	window.startArticleMarkdownEditor = function() {

		var element = document.getElementById("markdown-content")
		if (!window.EasyMDE || !element || element.dataset.started) return
		element.dataset.started = "true"

		// Bootstrap Icons per button, because EasyMDE's own buttons name FontAwesome icons, which this page does not load
		window.easyMDE = new EasyMDE({
			element: element,
			toolbar: [
				{name: "bold",           action: EasyMDE.toggleBold,           className: "bi bi-type-bold",     title: "Bold"},
				{name: "italic",         action: EasyMDE.toggleItalic,         className: "bi bi-type-italic",   title: "Italic"},
				{name: "heading",        action: EasyMDE.toggleHeadingSmaller, className: "bi bi-type-h1",       title: "Heading"},
				"|",
				{name: "quote",          action: EasyMDE.toggleBlockquote,     className: "bi bi-quote",         title: "Quote"},
				{name: "unordered-list", action: EasyMDE.toggleUnorderedList,  className: "bi bi-list-ul",       title: "Bulleted List"},
				{name: "ordered-list",   action: EasyMDE.toggleOrderedList,    className: "bi bi-list-ol",       title: "Numbered List"},
				"|",
				{name: "link",           action: EasyMDE.drawLink,             className: "bi bi-link-45deg",    title: "Link"},
				{name: "image",          action: EasyMDE.drawImage,            className: "bi bi-image",         title: "Image"},
				"|",
				{name: "guide", action: "https://www.markdownguide.org/basic-syntax/", className: "bi bi-question-circle", title: "Markdown Guide", noDisable: true},
			],
			autoDownloadFontAwesome: false,
			spellChecker: false,
			uploadImage: true,
			imageUploadEndpoint: "/{{.StreamID}}/upload-image",
			imagePathAbsolute: true,
		})
	}

	// Markdown posts as a form field named "content".  RULE: the bare Content-Type, because older Emissary builds refuse fetch's own "...;charset=UTF-8"
	window._save = async function() {
		var response = await fetch("/{{.StreamID}}/edit-content", {
			method: "POST",
			headers: {"Content-Type": "application/x-www-form-urlencoded"},
			body: new URLSearchParams({content: window.easyMDE.value()}).toString()
		})

		// A failed save stops save() and publish() here, so the page keeps the unsaved text
		if (!response.ok) throw new Error("Saving the article failed: " + response.status)
	}
</script>
<script src="/.themes/global/resources/easymde-2.21.0/easymde.min.js" onload="startArticleMarkdownEditor()"></script>
<script>startArticleMarkdownEditor()</script>
