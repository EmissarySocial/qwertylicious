<div class="page framed wide editor-none h-entry">
	<article id="article-editor" class="card border padding-none flex-column margin-bottom">

		<!-- The selected pencil, top right, returns to the Article, as Cancel did (its pair is in view.html) -->
		<a class="button primary edit-circle corner-pencil turboclick" href="/{{.StreamID}}" hx-push-url="unset" hx-replace-url="true" aria-pressed="true" aria-label="Done Editing">{{icon "pencil-fill"}}</a>
		<div class="pos-relative">
			{{- template "edit-banner" . -}}
		</div>

		<!-- Save, Properties, and Publish, above the heading and outside the reading column, so they align with the banner's right edge -->
		<div class="flex-row flex-align-center flex-justify-end padding">
			{{- if eq .StateID "published" -}}
				<button hx-get="/{{.StreamID}}/properties" class="button turboclick">Properties</button>
				<button hx-get="/{{.StreamID}}/unpublish" class="button turboclick">{{icon "check"}} Published</button>
				<button class="button success" hx-on:click="save()">{{icon "device-floppy"}} Save Changes</button>
			{{- else -}}
				<button class="button" hx-on:click="save()">{{icon "device-floppy"}} Save</button>
				<button hx-get="/{{.StreamID}}/properties" class="button turboclick">Properties</button>
				<button hx-on:click="publish()" class="button action">Publish</button>
			{{- end -}}
		</div>

		<div class="pos-relative padding-horizontal padding-bottom reading-column">
			{{- template "head-collection" . -}}

			<!-- The title, spaced as on the public view (head-summary.html) -->
			<h1 id="article-name" class="p-name margin-top-xs margin-bottom-lg">{{.Name}}</h1>

			{{- template "head-byline" . -}}

			<!-- The rule between the heading and the article, as on the public view -->
			<hr class="margin-none">
		</div>

		<div class="padding reading-column">
			{{- template "edit-content" . -}}
		</div>

		<div 
			hx-get="/{{.StreamID}}/edit"
			hx-trigger="refreshPage from:window"
			hx-target="main"
			hx-swap="innerHTML"
			hx-push-url="false">
		</div>
	</article>

</div>

<link rel="stylesheet" href="/.templates/qwerty-article/stylesheet" />
