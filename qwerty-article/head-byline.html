<!-- head-byline is the Article's description and byline, below the title on the public view and the edit page.
     RULE: spacing is in utility classes, because the public view loads no Article stylesheet (see AGENTS.md). -->
{{- if ne "" .Description -}}
	<div id="article-description" class="p-summary margin-bottom-lg">{{.Description}}</div>
{{- end -}}

<div id="article-byline" class="flex-row flex-align-center margin-bottom-lg">
	<div class="width-48 flex-center">
		<img src="{{.AttributedTo.IconURL}}" id="article-author-icon" class="width-48 circle">
	</div>
	<div id="article-author" class="p-author h-card flex-grow">
		<div class="p-name">
			<a class="turboclick" href="{{.AttributedTo.ProfileURL}}" hx-boost="true">{{.AttributedTo.Name}}</a>
		</div>
		<div class="text-sm">
			{{- if eq "published" .StateID -}}
				{{.PublishDate | longDate}}
			{{- else -}}
				Draft: Last Edited {{.UpdateDate | longDate}}
			{{- end -}}
		</div>
	</div>
	{{- if not .IsAuthor -}}
		<!-- The author does not follow themselves, so the edit page never shows this -->
		<!-- Follow opens the author's Follow modal, or follows in one click once CamperJS finds a saved account that can -->
		<div data-camper-intent="follow" data-camper-object="{{.AttributedTo.ProfileURL}}">
			<button type="button" class="primary text-sm turboclick camper-hide-if-ready" hx-get="/@{{.AttributedTo.UserID.Hex}}/follow" hx-push-url="false">⁂ Follow {{.AttributedTo.Name}}</button>
			<button type="button" class="primary text-sm camper-show-if-ready" data-camper-action="intent" hidden>⁂ Follow {{.AttributedTo.Name}}</button>
		</div>
		<script src="/.themes/global/resources/camperjs-0.2.0/camper.js"></script>
	{{- end -}}
</div>
