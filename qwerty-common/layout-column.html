{{- /* layout-column renders a slice of StreamSummary passed as ".", and fetches nothing. The caller handles the empty state. */ -}}
{{- range . -}}
	<a href="{{.URL}}" hx-boost="true" class="card qwerty-outbox-item text-plain text-nocolor turboclick">
		{{- if ne "" .IconURL -}}
			<div class="width-100%" style="height:300px; overflow:hidden;">
				<img src="{{.IconURL}}.webp" class="rounded object-fit-cover qwerty-outbox-item-image width-100%">
			</div>
		{{- end -}}

		<div class="padding flex-grow">
			<div class="text-lg bold qwerty-outbox-item-title">{{.Name}}</div>
			<div class="text-sm text-gray qwerty-outbox-item-description">{{.Description}}</div>
		</div>
		<div class="padding text-sm text-gray qwerty-outbox-item-date">{{.PublishDate | shortDate}}</div>
	</a>
{{- end -}}
