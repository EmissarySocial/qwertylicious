<!-- profile-tabs: the collections in the owner's order, called as (array $outbox $selected), where $selected is a collection ID. -->
<!-- The caller draws the row around it, and list.html draws profile-menu beside it (see AGENTS.md). -->
{{- $outbox := index . 0 -}}
{{- $selected := index . 1 -}}
{{- $userID := $outbox.UserID -}}
{{- $collections := ($outbox.Outbox.Where "templateId" "qwerty-collection").ByRank.Slice -}}

<div role="tablist" class="pills">
	<!-- RULE: a tab replaces the address instead of pushing it, so Back skips tab switches (see AGENTS.md) -->
	{{- range $collections -}}
		{{- $tabID := .ObjectID.Hex -}}
		<a class="turboclick" id="tab-{{$tabID}}"
			href="/@{{$userID}}?tab={{$tabID}}"
			hx-get="/{{$tabID}}/list"
			hx-target="#profile-tabs"
			hx-swap="outerHTML transition:true show:none"
			hx-push-url="unset"
			hx-replace-url="/@{{$userID}}?tab={{$tabID}}"
			role="tab"
			aria-selected="{{if eq $tabID $selected}}true{{else}}false{{end}}">{{.Label}}</a>
	{{- end -}}
</div>
