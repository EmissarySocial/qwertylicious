<!-- head: the entry's <head> tags, which as-modal puts in the full page so a shared link previews the entry, not the profile. -->
<title>{{.DomainLabel}} - {{.Label}}</title>
<link rel="canonical" href="{{.Permalink}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{.DomainLabel}}">
<meta property="og:title" content="{{.Label}}">
<meta property="og:url" content="{{.Permalink}}">
{{- if ne "" .IconURL }}
<meta property="og:image" content="{{.IconURL}}.webp?width=1200">
<meta name="twitter:card" content="summary_large_image">
{{- end }}
{{- if ne "" .Summary }}
<meta name="description" content="{{.Summary}}">
<meta property="og:description" content="{{.Summary}}">
{{- end }}
