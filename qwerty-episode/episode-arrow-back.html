<!-- episode-arrow-back: the skip button to the episode above, called with its ID, or "" to draw it disabled.
     RULE: each state is drawn whole; no action where an attribute name goes (see AGENTS.md). -->
{{- if ne "" . -}}
	<button type="button" class="qwerty-episode-arrow turboclick" data-episode-go="prev" aria-label="Previous Episode">{{icon "skip-backward-fill"}}</button>
{{- else -}}
	<button type="button" class="qwerty-episode-arrow" aria-label="Previous Episode" disabled>{{icon "skip-backward-fill"}}</button>
{{- end -}}
