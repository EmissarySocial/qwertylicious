<!-- head: the episode's <head> tags, which as-modal puts in the full page so a shared link previews the episode.
     The HTML description becomes plain text inside an attribute. -->
{{- $hasDescription := ne "" (print .ContentHTML) -}}
<title>{{.DomainLabel}} - {{.Label}}</title>
<link rel="canonical" href="{{.Permalink}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{.DomainLabel}}">
<meta property="og:title" content="{{.Label}}">
<meta property="og:url" content="{{.Permalink}}">
{{- if ne "" .IconURL }}
<meta property="og:image" content="{{.IconURL}}.webp?width=1200">
<meta name="twitter:card" content="summary_large_image">
{{- end }}
{{- if ne "" (.DataString "attachmentId") }}
<meta property="og:audio" content="{{.Permalink}}/audio?format=mp3">
<meta property="og:audio:type" content="audio/mpeg">
{{- end }}
{{- if $hasDescription }}
<meta name="description" content="{{.ContentHTML}}">
<meta property="og:description" content="{{.ContentHTML}}">
{{- end }}
