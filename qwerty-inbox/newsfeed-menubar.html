<!-- News Feed menu bar: the folder dropdown on the left, actions on the right. The dot is the Inbox builder. -->

{{- $folders := .FoldersWithSelection "FOLDER" -}}

<div id="menu-bar" 
    class="expanded"
    hx-get="/@me/newsfeed/newsfeed-menu?folderId={{$folders.SelectedID.Hex}}"
    hx-trigger="from:window"
    hx-swap="outerHTML"
    hx-push-url="false">
    <div class="left">{{- template "newsfeed-menubar-left" $folders -}}</div>
    <div class="right">{{- template "newsfeed-menubar-right" -}}</div>
</div>
