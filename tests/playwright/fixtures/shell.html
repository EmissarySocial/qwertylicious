<!-- No real audio in tests: play() and pause() only flip the paused flag and fire their events -->
<script>
const paused = new WeakMap()
Object.defineProperty(HTMLMediaElement.prototype, "paused", { get() { return paused.get(this) !== false } })
HTMLMediaElement.prototype.play = function () { paused.set(this, false); this.dispatchEvent(new Event("play")); return Promise.resolve() }
HTMLMediaElement.prototype.pause = function () { if (paused.get(this) === false) { paused.set(this, true); this.dispatchEvent(new Event("pause")) } }
HTMLMediaElement.prototype.load = function () { paused.set(this, true); this.dispatchEvent(new Event("emptied")) }
</script>
