<!-- A two-tab form as benpate/form draws it: General holds a text field, and Hashtags holds a list, as Edit Map does. -->
<button type="button" id="before-tabs">Before</button>
<form id="tabs-form">
<div class="layout-title">Edit Map</div><div class="tabs" data-script="install TabContainer"><div role="tablist"><button type="button" role="tab" id="tab-tabcontainer-0" class="tab-label" aria-controls="panel-tabcontainer-0" tabIndex="0" aria-selected="true">General</button><button type="button" role="tab" id="tab-tabcontainer-1" class="tab-label" aria-controls="panel-tabcontainer-1" tabIndex="0">Hashtags</button></div><div role="tabpanel" id="panel-tabcontainer-0" aria-labelledby="tab-tabcontainer-0"><div class="layout layout-vertical"><div class="layout-elements"><div class="layout-element layout-vertical-element"><label for="label_text" aria-hidden="true">Name</label><input name="label" id="label_text" aria-label="Name" tabIndex="0" type="text" maxlength="128" value="My Map"></div></div></div></div><div role="tabpanel" id="panel-tabcontainer-1" aria-labelledby="tab-tabcontainer-1" hidden="true"><div class="layout layout-vertical"><div class="layout-elements"><div class="layout-element layout-vertical-element"><label for="featuredTags_list" aria-hidden="true">Featured Hashtags</label><div id="featuredTags_list" class="list-widget" data-script="install ListWidget" data-maximum="12"><table class="grid list"><tbody><tr class="grid-row"><td class="grid-cell list-handle" aria-hidden="true"><i class="bi bi-grip-vertical"></i></td><td class="grid-cell"><input type="text" name="featuredTags" value="travel" aria-label="Featured Hashtags" aria-describedby="featuredTags_list-hint" autocomplete="off" maxlength="64"></td><td class="grid-cell grid-controls"><button type="button" class="list-remove" aria-label="Remove this row"><i class="bi bi-x-lg" aria-hidden="true"></i></button></td></tr><tr class="grid-row"><td class="grid-cell list-handle" aria-hidden="true"><i class="bi bi-grip-vertical"></i></td><td class="grid-cell"><input type="text" name="featuredTags" value="food" aria-label="Featured Hashtags" aria-describedby="featuredTags_list-hint" autocomplete="off" maxlength="64"></td><td class="grid-cell grid-controls"><button type="button" class="list-remove" aria-label="Remove this row"><i class="bi bi-x-lg" aria-hidden="true"></i></button></td></tr></tbody></table><template class="list-template"><tr class="grid-row"><td class="grid-cell list-handle" aria-hidden="true"><i class="bi bi-grip-vertical"></i></td><td class="grid-cell"><input type="text" name="featuredTags" value="" aria-label="Featured Hashtags" aria-describedby="featuredTags_list-hint" autocomplete="off" maxlength="64"></td><td class="grid-cell grid-controls"><button type="button" class="list-remove" aria-label="Remove this row"><i class="bi bi-x-lg" aria-hidden="true"></i></button></td></tr></template><button type="button" class="link list-add"><i class="bi bi-plus-lg" aria-hidden="true"></i><span> Add a Hashtag</span></button><div id="featuredTags_list-hint" class="list-hint hide-visual">Enter adds a row below. Alt+Up and Alt+Down move this row, and Alt+Home and Alt+End move it to the top or bottom.</div><div class="list-status hide-visual" aria-live="polite"></div></div></div></div></div></div></div>
</form>
