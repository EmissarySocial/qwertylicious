<!-- Wires the browser's Web Push subscription to the push-device-toggle on the notifications form.
RULE: the toggle is browser state, applied on Save because requestPermission needs that click.
RULE: polls for the toggle, and its id must stay an id field, not a path (see AGENTS.md). -->

<script>
(function() {
	var vapid = "{{.WebPushPublicKey}}";

	// Feature-detect once; without push support the toggle is left unwired
	var supported = !!vapid
		&& ("serviceWorker" in navigator)
		&& ("PushManager" in window)
		&& ("Notification" in window);

	if (!supported) { return; }

	function urlBase64ToUint8Array(base64String) {
		var padding = "=".repeat((4 - base64String.length % 4) % 4);
		var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
		var raw = window.atob(base64);
		var output = new Uint8Array(raw.length);
		for (var i = 0; i < raw.length; ++i) { output[i] = raw.charCodeAt(i); }
		return output;
	}

	var swReady = navigator.serviceWorker.register("/.web-push-worker.js").then(function() {
		return navigator.serviceWorker.ready;
	});

	// Toggle helpers, driving the widget through its setTrue / setFalse events

	function toggleIsOn(el) {
		return el.getAttribute("value") === "true";
	}

	// setToggle sets the toggle's state without user interaction.
	// RULE: fire through hyperscript's runtime.triggerEvent; its `on` handlers miss a plain dispatchEvent.
	function setToggle(el, on) {
		if (toggleIsOn(el) === on) { return; }
		var eventName = on ? "setTrue" : "setFalse";
		if (window._hyperscript && _hyperscript.internals && _hyperscript.internals.runtime) {
			_hyperscript.internals.runtime.triggerEvent(el, eventName);
		} else {
			el.dispatchEvent(new CustomEvent(eventName, { bubbles: true, cancelable: true, composed: true }));
		}
	}

	// Subscribe / unsubscribe

	function subscribeOptions() {
		return {
			userVisibleOnly: true,
			applicationServerKey: urlBase64ToUint8Array(vapid)
		};
	}

	function postSubscription(sub) {
		return fetch("/@me/push-subscriptions", {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify(sub)
		});
	}

	async function subscribe() {
		var reg = await swReady;
		var permission = await Notification.requestPermission();
		if (permission !== "granted") { return false; }

		var sub = await reg.pushManager.subscribe(subscribeOptions());
		var response = await postSubscription(sub);

		// RULE: on 409 (endpoint owned by another user) re-subscribe once; never retry a 403.
		if (response.status === 409) {
			await sub.unsubscribe();
			sub = await reg.pushManager.subscribe(subscribeOptions());
			response = await postSubscription(sub);
		}

		return response.ok;
	}

	async function unsubscribe() {
		var reg = await swReady;
		var sub = await reg.pushManager.getSubscription();
		if (sub) {
			await fetch("/@me/push-subscriptions", {
				method: "DELETE",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ endpoint: sub.endpoint })
			});
			await sub.unsubscribe();
		}
		return true;
	}

	// Wire the toggle once it exists in the DOM

	// RULE: wait for role="switch" and the hidden input, so setTrue / setFalse lands.
	var attempts = 0;
	function whenToggleReady(callback) {
		var el = document.getElementById("push-device-toggle");
		if (el && el.getAttribute("role") === "switch" && el.querySelector("input[type=hidden]")) {
			callback(el);
			return;
		}
		if (attempts++ > 100) { return; } // ~5s ceiling; give up quietly
		setTimeout(function() { whenToggleReady(callback); }, 50);
	}

	whenToggleReady(function(toggle) {

		// Notifications blocked by the browser: force the toggle off and explain why
		if (Notification.permission === "denied") {
			setToggle(toggle, false);
			toggle.dataset.original = "false";
			if (!document.getElementById("push-device-blocked")) {
				var note = document.createElement("div");
				note.id = "push-device-blocked";
				note.className = "text-sm text-gray margin-top-xs";
				note.textContent = "Push notifications are blocked. To enable them, allow notifications for this site in your browser settings.";
				toggle.parentNode.appendChild(note);
			}
			return;
		}

		// Hydrate the toggle from the browser's subscription
		swReady.then(function(reg) {
			return reg.pushManager.getSubscription();
		}).then(function(sub) {
			var on = !!sub;
			setToggle(toggle, on);
			toggle.dataset.original = on ? "true" : "false";
		}).catch(function() {
			// Registration failed: leave the toggle as it is
		});

		// Apply the toggle on the form's htmx Save (htmx:beforeRequest), replacing any earlier listener
		if (window._emissaryPushDeviceSubmit) {
			document.body.removeEventListener("htmx:beforeRequest", window._emissaryPushDeviceSubmit);
		}
		window._emissaryPushDeviceSubmit = function(event) {
			var el = document.getElementById("push-device-toggle");
			if (!el || el !== toggle) { return; }

			// RULE: only a request from the form that contains the toggle applies it
			var source = event.detail && event.detail.elt;
			if (!source || !source.contains(el)) { return; }

			var wanted = toggleIsOn(toggle);
			var original = toggle.dataset.original === "true";
			if (wanted === original) { return; }

			// Fire and forget: update the baseline now, and revert the toggle on failure
			toggle.dataset.original = wanted ? "true" : "false";
			if (wanted) {
				subscribe().then(function(ok) {
					if (!ok) { setToggle(toggle, false); toggle.dataset.original = "false"; }
				}).catch(function() { setToggle(toggle, false); toggle.dataset.original = "false"; });
			} else {
				unsubscribe().catch(function() {});
			}
		};
		document.body.addEventListener("htmx:beforeRequest", window._emissaryPushDeviceSubmit);
	});
})();
</script>
